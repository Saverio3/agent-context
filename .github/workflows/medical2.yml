name: medical2
on:
  push:
    paths: ["pilots/natality/**", "pilots/sperm/hormones.py", "pilots/sperm/fetch_visem.py", "pilots/fingerprint/commands_only.py", ".github/workflows/medical2.yml"]
  workflow_dispatch:
    inputs:
      jobs: {description: "all|fp|sperm|natality", default: "all"}
permissions:
  contents: write
jobs:
  fingerprint-commands:
    if: github.event_name == 'push' || inputs.jobs == 'all' || inputs.jobs == 'fp'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q boto3 numpy scipy scikit-learn
      - run: python pilots/fingerprint/fetch_mini.py 500
      - run: python pilots/fingerprint/commands_only.py data/mini.jsonl results/fingerprint
      - uses: actions/upload-artifact@v4
        with: {name: fp, path: results/fingerprint/COMMANDS_ONLY.md}
  sperm-hormones:
    if: github.event_name == 'push' || inputs.jobs == 'all' || inputs.jobs == 'sperm'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h / | tail -1
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q huggingface_hub remotezip opencv-python-headless numpy pandas scipy scikit-learn
      - name: fetch VISEM participant tables (server omits its intermediate cert, so add it from the cert's own AIA link)
        run: |
          AIA=$(echo | openssl s_client -connect datasets.simula.no:443 -servername datasets.simula.no 2>/dev/null | openssl x509 -noout -text | grep -oP 'CA Issuers - URI:\K\S+' | head -1)
          echo "intermediate: $AIA"
          curl -sSL "$AIA" -o inter.der && (openssl x509 -inform DER -in inter.der -out inter.pem 2>/dev/null || cp inter.der inter.pem)
          cat "$(python -c 'import certifi;print(certifi.where())')" inter.pem > bundle.pem
          REQUESTS_CA_BUNDLE=$PWD/bundle.pem python pilots/sperm/fetch_visem_csv.py /tmp/visem
          find /tmp/visem -iname "*hormone*" | grep -q .
      - run: python pilots/sperm/fetch_visem.py /tmp/visem && df -h / | tail -1 && find /tmp/visem -maxdepth 3 | head -40
      - run: python pilots/sperm/hormones.py /tmp/visem
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hormones
          path: |
            results/sperm/HORMONES.md
            results/sperm/video_features.csv
            results/sperm/video_features_raw.csv
  natality:
    if: github.event_name == 'push' || inputs.jobs == 'all' || inputs.jobs == 'natality'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q numpy pandas scikit-learn
      - name: download 2023 births
        run: |
          mkdir -p /tmp/nat && cd /tmp/nat
          for y in 2023 2022; do
            for u in "https://ftp.cdc.gov/pub/Health_Statistics/NCHS/Datasets/DVS/natality/Nat${y}us.zip" "https://ftp.cdc.gov/pub/Health_Statistics/NCHS/Datasets/DVS/natality/nat${y}us.zip"; do
              curl -sSLf -o n.zip "$u" && echo "got $u" && break
            done
            [ -s n.zip ] && break
          done
          unzip -o -q n.zip && rm n.zip && ls -la
      - env: {N_CTRL: "800000"}
        run: python pilots/natality/natality.py "$(ls -S /tmp/nat/* | head -1)"
      - uses: actions/upload-artifact@v4
        with: {name: natality, path: results/natality}
  commit:
    needs: [fingerprint-commands, sperm-hormones, natality]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dl}
      - run: |
          mkdir -p results/fingerprint results/sperm results/natality
          [ -d dl/fp ] && cp dl/fp/* results/fingerprint/ || true
          [ -d dl/hormones ] && cp -r dl/hormones/* results/sperm/ || true
          [ -d dl/natality ] && cp -r dl/natality/* results/natality/ || true
          git config user.name "lab-bot"; git config user.email "lab-bot@users.noreply.github.com"
          git add results && git commit -m "medical2 results [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
