name: probe
on: {workflow_dispatch: {}}
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q huggingface_hub
      - run: python pilots/probe/probe.py
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
