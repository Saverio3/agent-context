name: lab
on:
  push:
    paths: ["lab/**", ".github/workflows/lab.yml"]
  workflow_dispatch:
    inputs:
      n: {description: "runs per dataset", default: "3000"}
      groups: {description: "method groups (JSON list)", default: '["m","bc","defgx"]'}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        dataset: [nebius, swegym]
        group: ${{ fromJSON(github.event.inputs.groups || '["m","bc","defgx"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install huggingface_hub pyarrow numpy
      - run: python -m lab.fetch_data ${{ matrix.dataset }} --n ${{ github.event.inputs.n || '3000' }}
      - if: matrix.group == 'm'
        run: python -m lab.predict --jsonl data/${{ matrix.dataset }}.jsonl --out lab/model.json && cp lab/model.json model.json
      - run: python -m lab.run --jsonl data/${{ matrix.dataset }}.jsonl --group ${{ matrix.group }} --test-half --out out/${{ matrix.dataset }}/${{ matrix.group }} --label "${{ matrix.dataset }} public agent runs - group ${{ matrix.group }} - test half, runs the predictor never saw"
      - if: matrix.group == 'm'
        run: |
          cp model.json out/${{ matrix.dataset }}/m/model.json
          python -m lab.diagnose --jsonl data/${{ matrix.dataset }}.jsonl --method m18_keep_notes --out out/${{ matrix.dataset }}/m
          python -m lab.wander --jsonl data/${{ matrix.dataset }}.jsonl --out out/${{ matrix.dataset }}/m
      - uses: actions/upload-artifact@v4
        with: {name: "results-${{ matrix.dataset }}-${{ matrix.group }}", path: "out/${{ matrix.dataset }}/${{ matrix.group }}"}
  commit:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dl}
      - run: |
          for d in dl/results-*; do n=${d#dl/results-}; ds=${n%%-*}; g=${n#*-}; mkdir -p results/$ds/$g; cp -r $d/* results/$ds/$g/; done
          python -m lab.combine results
          git config user.name "lab-bot"; git config user.email "lab-bot@users.noreply.github.com"
          git add results && git commit -m "results: ${GITHUB_SHA::7} [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
