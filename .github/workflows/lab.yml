name: lab
on:
  push:
    paths: ["lab/**", ".github/workflows/lab.yml"]
  workflow_dispatch:
    inputs:
      n: {description: "runs per dataset", default: "3000"}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        dataset: [nebius, swegym]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install huggingface_hub pyarrow numpy
      - run: python -m lab.fetch_data ${{ matrix.dataset }} --n ${{ github.event.inputs.n || '3000' }}
      - run: python -m lab.predict --jsonl data/${{ matrix.dataset }}.jsonl --out lab/model.json && cp lab/model.json model.json
      - run: python -m lab.run --jsonl data/${{ matrix.dataset }}.jsonl --test-half --out results/${{ matrix.dataset }} --label "${{ matrix.dataset }} public agent runs (test half: runs the predictor never saw)"
      - run: cp model.json results/${{ matrix.dataset }}/model.json
      - uses: actions/upload-artifact@v4
        with: {name: "results-${{ matrix.dataset }}", path: "results/${{ matrix.dataset }}"}
  commit:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dl}
      - run: |
          for d in dl/results-*; do n=${d#dl/results-}; mkdir -p results/$n; cp -r $d/* results/$n/; done
          git config user.name "lab-bot"; git config user.email "lab-bot@users.noreply.github.com"
          git add results && git commit -m "results: ${GITHUB_SHA::7} [skip ci]" && git push || echo "nothing to commit"
