name: pilots4
on: {workflow_dispatch: {}}
permissions:
  contents: write
jobs:
  recon:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: "Qwen2.5-7B", url: "https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf"}
          - {label: "Llama-3.1-8B", url: "https://huggingface.co/bartowski/Meta-Llama-3.1-8B-Instruct-GGUF/resolve/main/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"}
          - {label: "Mistral-7B-v0.3", url: "https://huggingface.co/bartowski/Mistral-7B-Instruct-v0.3-GGUF/resolve/main/Mistral-7B-Instruct-v0.3-Q4_K_M.gguf"}
          - {label: "Gemma-2-9B", url: "https://huggingface.co/bartowski/gemma-2-9b-it-GGUF/resolve/main/gemma-2-9b-it-Q4_K_M.gguf"}
          - {label: "Phi-3.5-mini", url: "https://huggingface.co/bartowski/Phi-3.5-mini-instruct-GGUF/resolve/main/Phi-3.5-mini-instruct-Q4_K_M.gguf"}
          - {label: "Qwen2.5-3B", url: "https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf"}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake build-essential >/dev/null
      - run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build llama.cpp/build -j4 --target llama-server >/dev/null
      - run: curl -sSLf -o model.gguf "${{ matrix.url }}" && ls -la model.gguf
      - run: |
          (llama.cpp/build/bin/llama-server -m model.gguf --port 8080 -t 4 -c 4096 > server.log 2>&1 &)
          for i in $(seq 1 120); do curl -s localhost:8080/health | grep -q ok && break; sleep 3; done
          python pilots/lures/recon.py "${{ matrix.label }}" 40
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "recon-${{ matrix.label }}", path: results/lures}
  commit:
    needs: [recon]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dl}
      - run: |
          mkdir -p results/lures
          for d in dl/recon-*; do [ -d "$d" ] && cp "$d"/recon_*.json results/lures/ 2>/dev/null; done
          git config user.name "lab-bot"; git config user.email "lab-bot@users.noreply.github.com"
          git add results && git commit -m "recon results [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
