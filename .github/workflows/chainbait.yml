name: chainbait
on: {workflow_dispatch: {}}
permissions:
  contents: write
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: mkdir -p /tmp/solc && cd /tmp/solc && npm init -y >/dev/null && npm install -s solc@0.8.24
      - run: node pilots/chainbait/compile.js /tmp/solc && pip install -q "web3[tester]" && python pilots/chainbait/demo.py
      - uses: actions/upload-artifact@v4
        with: {name: chain-demo, path: results/chainbait}
  select:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: "Qwen2.5-7B", family: qwen, src: "https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf"}
          - {label: "Llama-3.1-8B", family: llama, src: "https://huggingface.co/bartowski/Meta-Llama-3.1-8B-Instruct-GGUF/resolve/main/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"}
          - {label: "Mistral-7B", family: mistral, src: "https://huggingface.co/bartowski/Mistral-7B-Instruct-v0.3-GGUF/resolve/main/Mistral-7B-Instruct-v0.3-Q4_K_M.gguf"}
          - {label: "Qwen2.5-7B-uncensored-abl", family: qwen, src: "QuantFactory/Qwen2.5-7B-Instruct-Uncensored-GGUF"}
          - {label: "Llama-3.1-8B-abliterated", family: llama, src: "mlabonne/Meta-Llama-3.1-8B-Instruct-abliterated-GGUF"}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake build-essential >/dev/null && pip install -q huggingface_hub
      - run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build llama.cpp/build -j4 --target llama-server >/dev/null
      - run: python pilots/retrained/getmodel.py "${{ matrix.src }}"
      - run: |
          (llama.cpp/build/bin/llama-server -m model.gguf --port 8080 -t 4 -c 4096 > server.log 2>&1 &)
          for i in $(seq 1 120); do curl -s localhost:8080/health | grep -q ok && break; sleep 3; done
          python pilots/chainbait/chain_lures.py "${{ matrix.label }}" 80
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "chain-${{ matrix.label }}", path: results/chainbait}
  commit:
    needs: [demo, select]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dl}
      - run: |
          mkdir -p results/chainbait && cp dl/chain-*/* results/chainbait/ 2>/dev/null || true
          python3 pilots/chainbait/summarise.py || true
          git config user.name "lab-bot"; git config user.email "lab-bot@users.noreply.github.com"
          git add results && git commit -m "chainbait results [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
