name: rpc-debug
on: {workflow_dispatch: {}}
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake build-essential tcpdump >/dev/null
      - run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -DGGML_RPC=ON -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build llama.cpp/build -j4 --target llama-server ggml-rpc-server >/dev/null
          curl -sSL -o model.gguf https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
      - run: |
          B=llama.cpp/build/bin
          $B/ggml-rpc-server --help 2>&1 | head -30 || true
          $B/llama-server --help 2>&1 | grep -i -A2 rpc || true
      - run: |
          B=llama.cpp/build/bin
          ($B/ggml-rpc-server -p 50052 -t 1 > a.log 2>&1 &)
          ($B/ggml-rpc-server -p 50053 -t 1 > b.log 2>&1 &)
          sleep 4
          $B/llama-server --rpc 127.0.0.1:50052,127.0.0.1:50053 --list-devices 2>&1 | tail -8
          DEVS=$($B/llama-server --rpc 127.0.0.1:50052,127.0.0.1:50053 --list-devices 2>&1 | grep -oE '^ *RPC[^:]*' | tr -d ' ' | paste -sd, -)
          echo "DEVS=$DEVS"
          sudo timeout 90 tcpdump -l -i lo -nn -q 'tcp port 50052 or tcp port 50053' 2>/dev/null > pk.txt &
          timeout 120 $B/llama-server -m model.gguf --port 8091 -t 1 -c 2048 -ngl 99 --rpc 127.0.0.1:50052,127.0.0.1:50053 --device $DEVS > s.log 2>&1 &
          for i in $(seq 1 60); do curl -s localhost:8091/health && break; sleep 2; done; echo
          for k in 1 2 3; do curl -s localhost:8091/completion -d '{"prompt":"Hello","n_predict":30}' | head -c 120; echo; done
          sleep 5; echo "packets: $(wc -l < pk.txt)"; head -3 pk.txt
          grep -iE "rpc|offload|device|buffer" s.log | head -20
