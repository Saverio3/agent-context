name: pilots5
on: {workflow_dispatch: {}}
permissions:
  contents: write
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: "Qwen2.5-7B-uncensored-abl", family: qwen, src: "QuantFactory/Qwen2.5-7B-Instruct-Uncensored-GGUF"}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake build-essential >/dev/null && pip install -q huggingface_hub
      - run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build llama.cpp/build -j4 --target llama-server >/dev/null
      - run: python pilots/retrained/getmodel.py "${{ matrix.src }}" && ls -la model.gguf
      - run: |
          (llama.cpp/build/bin/llama-server -m model.gguf --port 8080 -t 4 -c 4096 > server.log 2>&1 &)
          for i in $(seq 1 120); do curl -s localhost:8080/health | grep -q ok && break; sleep 3; done
          python pilots/retrained/cmds.py "${{ matrix.label }}" "${{ matrix.family }}"
          rm -rf results/lures && python pilots/lures/lures.py "${{ matrix.label }}" 60
          mkdir -p results/retrained && cp results/lures/*.json results/retrained/lures_${{ matrix.label }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "ret-${{ matrix.label }}", path: results/retrained}
  commit:
    needs: [run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with: {path: dl}
      - run: |
          mkdir -p results/retrained && cp dl/ret-*/*.json results/retrained/ 2>/dev/null || true
          pip install -q numpy scikit-learn && python pilots/retrained/analyse.py || true
          git config user.name "lab-bot"; git config user.email "lab-bot@users.noreply.github.com"
          git add results && git commit -m "retrained-model results [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
