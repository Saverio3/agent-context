name: fingerprint
on:
  push:
    paths: ["pilots/fingerprint/**", ".github/workflows/fingerprint.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install boto3 numpy scikit-learn
      - run: python pilots/fingerprint/fetch_mini.py 500
      - run: python -c "import json;d=json.loads(open('data/mini.jsonl').readline());print([ (r,t[-300:]) for r,t in d['messages'][2:5]])"
      - run: python pilots/fingerprint/fingerprint.py data/mini.jsonl results/fingerprint
      - run: |
          git config user.name "lab-bot"; git config user.email "lab-bot@users.noreply.github.com"
          git add results/fingerprint && git commit -m "fingerprint results (13 models) [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
