name: fingerprint
on:
  push:
    paths: ["lab/fingerprint.py", ".github/workflows/fingerprint.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install huggingface_hub pyarrow numpy scikit-learn
      - run: python -m lab.fetch_data nebius --n 12000
      - run: python -m lab.fingerprint --jsonl data/nebius.jsonl --limit 12000 --out results/nebius/fingerprint
      - run: |
          git config user.name "lab-bot"; git config user.email "lab-bot@users.noreply.github.com"
          git add results && git commit -m "fingerprint results [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
