name: frontier
on:
  workflow_dispatch:
    inputs:
      models: {description: "all | or comma list e.g. GPT-4o,Gemini-2.5-Flash", default: "all"}
permissions:
  contents: write
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: "GPT-4o",            provider: openai,    model: "gpt-4o",            budget: "1.50", keyenv: OPENAI_API_KEY}
          - {label: "Claude-Sonnet-4.5", provider: anthropic, model: "claude-sonnet-4-5", budget: "1.20", keyenv: ANTHROPIC_API_KEY}
          - {label: "Gemini-2.5-Flash",  provider: gemini,    model: "gemini-2.0-flash",    budget: "0.00", keyenv: GEMINI_API_KEY}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: check selection and key
        run: |
          SEL="${{ github.event.inputs.models }}"
          if [ "$SEL" != "all" ] && ! echo "$SEL" | grep -q "${{ matrix.label }}"; then echo "not selected — skipping ${{ matrix.label }}"; echo "SKIP=1" >> $GITHUB_ENV; fi
          if [ -z "${{ env[matrix.keyenv] }}" ]; then echo "::warning::secret ${{ matrix.keyenv }} is empty — skipping ${{ matrix.label }}"; echo "SKIP=1" >> $GITHUB_ENV; fi
      - name: run all behavioural pilots against ${{ matrix.label }}
        if: env.SKIP != '1'
        env:
          PROVIDER: ${{ matrix.provider }}
          MODEL: ${{ matrix.model }}
          TAG: ${{ matrix.label }}
          BUDGET_USD: ${{ matrix.budget }}
        run: |
          rm -f /tmp/stop_proxy
          python pilots/frontier/proxy.py & PROXY=$!
          for i in $(seq 1 30); do curl -s localhost:8080/health | grep -q ok && break; sleep 1; done
          echo "== web lures ==";    python pilots/lures/lures.py                "${{ matrix.label }}" 30 || true
          echo "== on-chain bait =="; python pilots/chainbait/chain_lures.py     "${{ matrix.label }}" 30 || true
          echo "== worm tripwires =="; python pilots/tripwire/tripwire.py        "${{ matrix.label }}" 20 || true
          echo "== recon method ==";  python pilots/lures/recon.py               "${{ matrix.label }}" 20 || true
          touch /tmp/stop_proxy; sleep 3; wait $PROXY || true
          echo "=== usage ==="; cat results/frontier/usage_*.json
          L="${{ matrix.label }}"; SL=$(echo "$L" | sed 's/[^A-Za-z0-9.]/_/g')
          for f in "results/lures/$SL.json" "results/chainbait/lures_$SL.json" "results/tripwire/$L.json" "results/lures/recon_$L.json"; do
            [ -f "$f" ] && echo "ok  $f" || echo "::warning::missing $f"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "frontier-${{ matrix.label }}"
          path: |
            results/frontier
            results/lures
            results/chainbait
            results/tripwire
  summary:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q numpy
      - uses: actions/download-artifact@v4
        with: {path: dl}
      - run: |
          mkdir -p results/lures results/chainbait results/tripwire results/frontier
          for d in dl/frontier-*; do cp -r "$d"/* results/ 2>/dev/null || true; done
          # move nested frontier usage up if needed
          find dl -path '*frontier/usage_*.json' -exec cp {} results/frontier/ \; 2>/dev/null || true
          python pilots/frontier/summarise.py || true
          git config user.name "lab-bot"; git config user.email "lab-bot@users.noreply.github.com"
          git add results && git commit -m "frontier-model results [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
