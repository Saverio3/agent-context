name: medical-fetch
on:
  push:
    paths: ["pilots/medical/fetch.py", ".github/workflows/medical-fetch.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 pilots/medical/fetch.py
      - run: |
          find data/medical -size +90M -print -exec gzip -9 {} \;
          git config user.name "lab-bot"; git config user.email "lab-bot@users.noreply.github.com"
          git add data/medical && git commit -m "medical data [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
