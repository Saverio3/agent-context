name: humanoid-fetch
on:
  push:
    paths: ["pilots/humanoid/urls.txt", "pilots/humanoid/fetch.py", ".github/workflows/humanoid-fetch.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 pilots/humanoid/fetch.py
      - run: |
          git config user.name "lab-bot"; git config user.email "lab-bot@users.noreply.github.com"
          git add data/humanoid && git commit -m "humanoid raw pages [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
