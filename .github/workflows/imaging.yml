name: imaging
on:
  push:
    paths: ["pilots/imaging/**", ".github/workflows/imaging.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kids:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -q torchxrayvision scikit-learn pillow huggingface_hub pyarrow
      - name: fetch paediatric chest X-rays
        run: |
          mkdir -p /tmp/kids && cd /tmp/kids
          if curl -sSLf -o x.zip "https://data.mendeley.com/public-files/datasets/rscbjbr9sj/files/f12eaf6d-6023-432f-acc9-80c9d7393433/file_downloaded"; then
            unzip -q x.zip && rm x.zip
          else
            echo "mendeley failed; trying Hugging Face mirror"
            python - <<'EOF'
          import glob, io, os
          import pyarrow.parquet as pq
          from huggingface_hub import snapshot_download
          from PIL import Image
          p = snapshot_download("hf-vision/chest-xray-pneumonia", repo_type="dataset", local_dir="hf")
          for f in glob.glob("hf/**/*.parquet", recursive=True):
              split = "test" if "test" in f else ("val" if "val" in f else "train")
              t = pq.read_table(f).to_pandas()
              for i, r in t.iterrows():
                  lab = "PNEUMONIA" if r["label"] == 1 else "NORMAL"
                  os.makedirs(f"x/{split}/{lab}", exist_ok=True)
                  Image.open(io.BytesIO(r["image"]["bytes"])).save(f"x/{split}/{lab}/{os.path.basename(f)}_{i}.jpeg")
          EOF
          fi
          find /tmp/kids -maxdepth 4 -type d | head -20
      - run: python pilots/imaging/kids.py /tmp/kids
      - uses: actions/upload-artifact@v4
        with: {name: kids, path: results/imaging}
  change:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -q torchxrayvision scikit-learn pillow pandas
      - name: fetch NIH ChestX-ray14 batches 1-3
        run: |
          mkdir -p /tmp/nih && cd /tmp/nih
          for u in vfk49d74nhbxq3nqjg0900w5nvkorp5c i28rlmbvmfjbl8p2n3ril0pptcmcu9d1 f1t00wrtdk94satdfb9olcolqx20z2jp; do
            curl -sSLf -o b.tar.gz "https://nihcc.box.com/shared/static/$u.gz" && tar xzf b.tar.gz && rm b.tar.gz || echo "failed $u"
            df -h / | tail -1
          done
          find /tmp/nih -name '*.png' | wc -l
          python -c "import torchxrayvision as x, os, glob; print(glob.glob(os.path.join(os.path.dirname(x.__file__),'data','*')))"
      - run: python pilots/imaging/change.py /tmp/nih
      - uses: actions/upload-artifact@v4
        with: {name: change, path: results/imaging}
  commit:
    needs: [kids, change]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dl}
      - run: |
          mkdir -p results/imaging
          cp dl/*/*.md results/imaging/ 2>/dev/null || true
          git config user.name "lab-bot"; git config user.email "lab-bot@users.noreply.github.com"
          git add results && git commit -m "imaging results [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
